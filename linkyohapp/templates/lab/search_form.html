{% load i18n discovery_tags %}
<form class="search-form {% if is_home %}home-search{% endif %}" action="{% url 'search' %}" method="get" data-search>
<input type="hidden" name="lang" value="{{ discovery_language }}">
<label class="{% if is_home %}sr-only{% else %}search-label{% endif %}" for="need">{% translate "What do you need done?" %}</label>
<div class="search-input"><i data-lucide="search" aria-hidden="true"></i><input type="search" id="need" name="q" value="{{ search_query }}" maxlength="200" placeholder="{% translate 'A plumber in Cayo, a carpenter in Belmopan…' %}"><button class="btn btn-primary" type="submit"><span>{% translate "Find a pro" %}</span><noscript>{% translate "Search" %}</noscript><i data-lucide="arrow-right" aria-hidden="true"></i></button></div>
<details class="filters" data-expand-desktop="{% if is_home %}false{% else %}true{% endif %}"><summary><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>{% if is_home %}{% translate "Browse by category or area" %}{% else %}{% translate "Filters" %}{% endif %}</span><i data-lucide="chevron-down" aria-hidden="true"></i></summary>
<div class="filter-fields">
<label for="category">{% translate "Category" %}<select name="category" id="category"><option value="">{% translate "All categories" %}</option>{% for item in search_categories %}<option value="{{ item.pk }}" {% if selected_category == item.pk|stringformat:'s' %}selected{% endif %}>{{ item|taxonomy_label }}</option>{% endfor %}</select></label>
<label for="subcategory">{% translate "Service" %}<select name="subcategory" id="subcategory"><option value="">{% translate "All services" %}</option>{% for item in search_subcategories %}<option value="{{ item.pk }}" data-parent="{{ item.category_id }}" {% if selected_subcategory == item.pk|stringformat:'s' %}selected{% endif %}>{{ item|taxonomy_label }}</option>{% endfor %}</select></label>
<label for="district">{% translate "District" %}<select name="district" id="district"><option value="">{% translate "All districts" %}</option>{% for item in search_districts %}<option value="{{ item.pk }}" {% if selected_district == item.pk|stringformat:'s' %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
<label for="location">{% translate "Town or village" %}<select name="location" id="location"><option value="">{% translate "All towns" %}</option>{% for item in search_locations %}<option value="{{ item.pk }}" data-parent="{{ item.local.local_district_id }}" {% if selected_location == item.pk|stringformat:'s' %}selected{% endif %}>{{ item }} ({{ item.local.local_district }})</option>{% endfor %}</select></label>
<button class="btn filter-apply" type="submit"><i data-lucide="search" aria-hidden="true"></i>{% translate "Apply filters" %}</button></div>
<details class="price-filters"><summary>{% translate "Price range" %}</summary><div class="filter-fields"><label>{% translate "Minimum BZD" %}<input type="number" name="min_price" min="0" max="999999999" value="{{ min_price }}"></label><label>{% translate "Maximum BZD" %}<input type="number" name="max_price" min="0" max="999999999" value="{{ max_price }}"></label></div></details>
</details></form>

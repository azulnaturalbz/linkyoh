services:
  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LYDEPLOYMENT_MODE: app
      LYSTATIC_ROOT: /linkyoh/staticfiles
      LYDIRECTORY_RATE_LIMIT: 'True'
      LYRATE_LIMIT_REDIS_URL: redis://directory_limits:6379/0
      LYTRUSTED_PROXY_NETWORKS: ${LYTRUSTED_PROXY_NETWORKS:?Set the verified shared edge network CIDR before deployment}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://linkyoh:linkyoh@rabbitmq:5672//}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             exec gunicorn linkyoh.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2}"
    volumes:
      - static_volume:/linkyoh/staticfiles
      - media_volume:/linkyoh/media
    expose:
      - "8000"
    networks:
      linkyoh_network:
      edge:
        aliases:
          - linkyoh-web
    depends_on:
      directory_limits:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  directory_limits:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 16mb --maxmemory-policy noeviction
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 3
    networks:
      - linkyoh_network

  celery_worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LYDEPLOYMENT_MODE: app
      LYSTATIC_ROOT: /linkyoh/staticfiles
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://linkyoh:linkyoh@rabbitmq:5672//}
    command: celery -A linkyoh worker -l info
    volumes:
      - media_volume:/linkyoh/media
    networks:
      - linkyoh_network
    depends_on:
      - web
      - rabbitmq

  celery_beat:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LYDEPLOYMENT_MODE: app
      LYSTATIC_ROOT: /linkyoh/staticfiles
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://linkyoh:linkyoh@rabbitmq:5672//}
    command: celery -A linkyoh beat -l info
    volumes:
      - media_volume:/linkyoh/media
    networks:
      - linkyoh_network
    depends_on:
      - web
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-linkyoh}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-linkyoh}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - linkyoh_network

volumes:
  static_volume:
  media_volume:
  rabbitmq_data:

networks:
  linkyoh_network:
    driver: bridge
  edge:
    external: true
    name: edge
